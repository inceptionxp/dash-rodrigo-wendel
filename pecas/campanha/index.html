<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Central da campanha · Academia DTM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=Hanken+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#101c46;--lima:#cdf23f;--papel:#f4f2ec;--papel2:#ebe8df;--tinta:#141a33;--mut:#5d6380;--ln:#dcd8cc}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.55 "Hanken Grotesk",-apple-system,sans-serif}
h1,h2,h3{font-family:Archivo,sans-serif;letter-spacing:-.02em;margin:0}
.topo{background:var(--navy);color:#fff;padding:32px 16px 0}
.in{max-width:1120px;margin:0 auto}
.marca{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#ffffffb0;margin-bottom:12px}
.marca b{color:var(--lima)}
.topo h1{font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.05}
.atual{font-family:"Space Mono",monospace;font-size:12px;color:#ffffffa0;margin-top:10px}
.abas{display:flex;gap:4px;margin-top:24px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.abas::-webkit-scrollbar{display:none}
.abas a{flex:0 0 auto;color:#ffffffc0;text-decoration:none;font-weight:700;font-size:15px;padding:12px 16px;border-radius:10px 10px 0 0;white-space:nowrap;min-height:44px}
.abas a span{font-family:"Space Mono",monospace;font-size:12px;opacity:.7;margin-left:6px}
.abas a.on{background:var(--papel);color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;min-height:44px}
.btn.lima{background:var(--lima);color:var(--navy)}
.btn.nav{background:var(--navy);color:#fff}
main{max-width:1120px;margin:0 auto;padding:26px 16px 80px}
.aba{display:none}.aba.on{display:block}
.info{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 16px;margin-bottom:24px;font-size:15px;color:var(--mut)}
.info b{color:var(--tinta)}
.topacao{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
.topacao h2{font-size:26px}
.card{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:18px;margin-bottom:24px}
.card.ad{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px}
.prevs{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,.75fr);gap:12px;align-items:start}
.prev img{display:block;width:100%;height:auto;border-radius:10px;background:var(--papel2)}
.prev .rot{font-family:"Space Mono",monospace;font-size:12px;color:var(--mut);margin:6px 0}
.prev .btn{width:100%;justify-content:center;font-size:14px;padding:9px 10px;min-height:40px}
.num{font-family:"Space Mono",monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:700}
.card h3{font-size:22px;margin:4px 0 14px;line-height:1.2}
.sub{color:var(--mut);font-size:14px;margin:-8px 0 14px}
.campo{margin-bottom:14px}
.campo .lbl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:14px;margin-bottom:6px}
.campo pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:15px;background:var(--papel);border-radius:10px;padding:10px 12px}
.cp{border:1px solid var(--ln);background:#fff;border-radius:8px;padding:5px 10px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;color:var(--navy);white-space:nowrap;min-height:36px}
.cp.feito{background:#1f9d6b;color:#fff;border-color:#1f9d6b}
.vazio{color:var(--mut);font-style:italic}
/* visão geral */
.conts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:24px}
.cont{background:var(--navy);color:#fff;border-radius:14px;padding:14px;text-decoration:none}
.cont b{display:block;font-family:Archivo,sans-serif;font-size:38px;line-height:1;color:var(--lima)}
.cont span{font-size:14px;color:#ffffffd0}
.canais{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:24px}
.canal{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.canal h3{font-size:18px;margin-bottom:6px}
.canal .quem{font-family:"Space Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy);background:var(--lima);display:inline-block;padding:2px 8px;border-radius:6px;margin-bottom:8px}
.canal p{margin:0;font-size:15px;color:var(--mut)}
.tab{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:15px}
.tab th,.tab td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--ln);vertical-align:top}
.tab th{background:var(--navy);color:#fff;font-weight:700;font-size:14px}
.tab td.d{font-family:"Space Mono",monospace;font-weight:700;white-space:nowrap}
.tabwrap{overflow-x:auto;border-radius:14px;border:1px solid var(--ln)}
.tab a{color:var(--navy);font-weight:700}
.leg{font-size:14px;color:var(--mut);margin:8px 0 0}
/* roteiro */
.rot-lista{margin:0 0 18px;border:1px solid var(--ln);border-radius:12px;overflow:hidden}
.cena{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px 14px;border-bottom:1px solid var(--ln)}
.cena:last-child{border-bottom:0}
.cena .t{font-family:"Space Mono",monospace;font-size:13px;font-weight:700;color:var(--navy)}
.cena .fala{font-size:17px;font-weight:500;margin-bottom:6px}
.cena .meta{font-size:13px;color:var(--mut);overflow-wrap:anywhere}
.cena .meta b{font-weight:700}
.dois{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px}
@media (max-width:820px){
  .card.ad,.dois{grid-template-columns:minmax(0,1fr)}.card{padding:14px}
  .conts{grid-template-columns:repeat(2,minmax(0,1fr))}.canais{grid-template-columns:minmax(0,1fr)}
  .cena{grid-template-columns:minmax(0,1fr);gap:4px}
}
.tira{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;margin:8px 0}.tira img{width:120px;height:150px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#ebe8df}.acoes-c{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>

<script>
const D={"atualizado": "23 de outubro de 2026", "ads": [{"n": 1, "angulo": "O caso que você encaminha", "headline": "Você encaminha. O colega fecha o tratamento", "texto": "Dentista, o paciente com a mandíbula estalando e travando senta na sua cadeira. Você passa o contato, e o colega fecha o plano.\n\nEncaminhar foi a decisão responsável: a graduação quase não ensina o critério. Só que cerca de 3 em cada 10 adultos têm DTM (Valesan et al., 2021), então esse caso volta.\n\nConheça a formação Viver de DTM, do Dr. Rodrigo Wendel, para dentista que não é especialista em DTM. Toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo": "O caso de DTM pode ficar com você", "desc": "Formação para quem não é especialista", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad01"}, {"n": 2, "angulo": "A demanda na cadeira", "headline": "A demanda que já senta na sua cadeira", "texto": "Dentista, 3 em 10 adultos têm DTM (Valesan et al., 2021): parte da sua agenda de amanhã procura o que você não oferece.\n\nQuem reconhece o quadro cobra a avaliação e apresenta o plano de tratamento. Quem não reconhece trata como bruxismo ou encaminha.\n\nConheça a formação Viver de DTM, do Dr. Rodrigo Wendel, para dentista que não é especialista em DTM. Toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo": "A demanda que já senta na sua cadeira", "desc": "3 em 10 adultos têm DTM", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad02"}, {"n": 3, "angulo": "A avaliação a R$ 540", "headline": "Avaliação de DTM: R$ 540", "texto": "Dentista, a avaliação de DTM na clínica do Dr. Rodrigo Wendel custa R$ 540, antes de qualquer placa.\n\nÉ uma avaliação longa: anamnese, exame físico e imagem. Na Viver de DTM, ele ensina a conduzir e cobrar essa avaliação como ato clínico, para dentista que não é especialista em DTM.\n\nA turma fundadora começa em 23 de fevereiro de 2027, e a conversa vem antes da matrícula. Conheça a formação Viver de DTM: toque em Saiba mais e converse 30 minutos com o Dr. Rodrigo Wendel.", "titulo": "Avaliação de DTM custa R$ 540", "desc": "Preço real, na clínica do Dr. Rodrigo Wendel", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad03"}, {"n": 4, "angulo": "O caso que outros devolveram", "headline": "Seja quem recebe o caso que outros devolvem", "texto": "Dentista, todo clínico tem o colega para quem manda o caso de mandíbula que não quer pegar. Esse colega pode ser você.\n\nO Dr. Rodrigo Wendel atendeu mais de 8.000 pacientes e ensina, na Viver de DTM, o caminho do diagnóstico ao plano de tratamento.\n\nMais de 300 dentistas já foram formados por ele. A turma fundadora começa em 23 de fevereiro de 2027. Conheça a formação Viver de DTM: toque em Saiba mais e peça a conversa de 30 minutos.", "titulo": "O caso que outros devolveram", "desc": "Com o Dr. Rodrigo Wendel", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad04"}, {"n": 5, "angulo": "O nome da cidade", "headline": "Toda cidade tem o dentista do implante", "texto": "Dentista, na sua cidade todo mundo sabe quem indicar para implante. E para a mandíbula que trava, quem o paciente procura?\n\nO Dr. Rodrigo Wendel formou mais de 300 dentistas em DTM. A Viver de DTM é a formação dele para quem não é especialista e quer ser a referência que a cidade indica.\n\nConheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos com o Dr. Rodrigo Wendel.", "titulo": "O nome de DTM da sua cidade", "desc": "Formação do Dr. Rodrigo Wendel", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad05"}, {"n": 6, "angulo": "Protocolo para tudo, menos para isso", "headline": "Cárie, canal e extração: você tem protocolo", "texto": "Dentista, cárie pede restauração, pulpite pede canal. Em DTM, a indicação é apenas uma resposta: a placa.\n\nA graduação quase não ensina as outras respostas, e isso não tem a ver com talento. Mas na formação o Dr. Rodrigo Wendel ensina a Abordagem Multimodal: várias ferramentas, escolhidas pelo diagnóstico.\n\nÉ a Viver de DTM, para dentista que não é especialista em DTM. O Dr. Rodrigo Wendel conversa com um dentista por dia, às segundas, quartas e quintas. Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo": "Um protocolo para a mandíbula", "desc": "Abordagem Multimodal em DTM", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad06"}, {"n": 7, "angulo": "O tratamento conservador", "headline": "Trate a mandíbula sem cirurgia nem desgaste", "texto": "Dentista, antes da placa e muito antes do bisturi existe um tratamento conservador que a graduação não mostra.\n\nO Dr. Rodrigo Wendel ensina esse caminho na Viver de DTM, para dentista que não é especialista em DTM.\n\nConheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo": "Tratamento conservador para a mandíbula", "desc": "Formação em DTM para dentistas", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad07"}, {"n": 8, "angulo": "Quem fechou o diagnóstico", "headline": "O paciente indica quem fechou o diagnóstico", "texto": "Dentista, otorrino, neurologista, ortopedista: cada um disse uma coisa. O nome que o paciente repete é o de quem explicou.\n\nO Dr. Rodrigo Wendel quer ser o último dentista que o paciente procura. Na Viver de DTM, ensina o diagnóstico e a conversa de devolutiva a dentista que não é especialista em DTM.\n\nA turma fundadora começa em 23 de fevereiro de 2027. Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo": "Seja o último dentista que ele procura", "desc": "Formação em DTM para dentistas", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad08"}, {"n": 9, "angulo": "Um caso vira plano", "headline": "Um caso de DTM vira plano, não consulta", "texto": "Dentista, uma restauração se resolve numa consulta. O caso de DTM começa na avaliação, vira plano e sai com retorno marcado.\n\nNa Viver de DTM, você aprende a conduzir o caso do diagnóstico ao plano, para dentista que não é especialista em DTM.\n\nA turma fundadora começa em 23 de fevereiro de 2027. Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo": "Um caso de DTM vira plano", "desc": "Formação para quem não é especialista", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad09"}, {"n": 10, "angulo": "Por dentro da clínica", "headline": "Por dentro da clínica que vive de DTM", "texto": "Dentista, uma clínica de pé com um tipo de caso: a ficha lida antes, a avaliação cobrada, o plano com retorno marcado.\n\nQuem faz a Viver de DTM acompanha dois dias dessa rotina na clínica do Dr. Rodrigo Wendel. É bônus da turma fundadora, que começa em 23 de fevereiro de 2027.\n\nConheça a formação Viver de DTM: toque em Saiba mais e reserve sua conversa de 30 minutos.", "titulo": "Por dentro de uma clínica de DTM", "desc": "Formação em DTM para dentistas", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=ad10"}], "vids": [{"n": 1, "titulo": "A paciente que não queria pagar a avaliação", "dur": "45 s", "cenas": [{"t": "0-3 s", "fala": "A paciente não queria pagar a avaliação.", "cena": "[CENA: Dr. Rodrigo Wendel em plano médio na sala de consulta, ficha na mão, olhando para a câmera]", "tela": "[CARTELA: Ela não queria pagar]"}, {"t": "3-14 s", "fala": "Foi por volta de 2001. Eu cobrava porque a avaliação de DTM é longa. Ela se recusou, e eu fiz a avaliação mesmo assim.", "cena": "[CENA: plano fechado das mãos preenchendo a ficha, gravado na clínica]", "tela": "[CARTELA: Avaliação longa]"}, {"t": "14-28 s", "fala": "Fiz a anamnese, o exame físico, as medidas. No meio, percebi que ela estava incomodada e perguntei. Ela disse: Rodrigo, estou com vergonha. Eu não quis pagar a avaliação.", "cena": "[CENA: volta ao plano médio] [B-ROLL: consultorio-cadeira.jpg, push lento]", "tela": "[CARTELA: Estou com vergonha] [LEGENDA: \"eu não quis pagar\"]"}, {"t": "28-38 s", "fala": "Ela esperava uma olhada nos dentes. Quando viu o que uma avaliação de DTM é, entendeu por que eu cobrava.", "cena": "[CENA: rosto, sem corte]", "tela": "[CARTELA: Ela entendeu o valor]"}, {"t": "38-45 s", "fala": "Na Viver de DTM eu ensino a conduzir e a cobrar essa avaliação. Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "cena": "[CENA: rosto]", "tela": "[CTA NA TELA: Conheça a formação Viver de DTM] [BOTÃO DA PLATAFORMA: Saiba mais]"}], "texto": "Dentista, uma paciente não quis pagar a avaliação de DTM do Dr. Rodrigo Wendel e, no meio da consulta, ficou com vergonha.\n\nNa Viver de DTM, ele ensina a conduzir e cobrar a avaliação, para dentista que não é especialista em DTM.\n\nA turma fundadora começa em 23 de fevereiro de 2027. Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo_meta": "Ela não queria pagar a avaliação", "desc": "Formação em DTM para dentistas", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=v1"}, {"n": 2, "titulo": "A consulta que não começa pela queixa", "dur": "45 s", "cenas": [{"t": "0-3 s", "fala": "Minha consulta não começa perguntando a queixa.", "cena": "[CENA: Dr. Rodrigo Wendel de pé na sala de consulta, ao lado da cadeira, olhando para a câmera]", "tela": "[CARTELA: Não começa pela queixa]"}, {"t": "3-13 s", "fala": "Uma frase mudou a minha consulta: quem começa com \"o que te traz aqui\" termina com \"eu vou pensar\".", "cena": "[CENA: plano médio]", "tela": "[CARTELA: \"O que te traz aqui\"] [LEGENDA: \"eu vou pensar\"]"}, {"t": "13-27 s", "fala": "Hoje eu me apresento primeiro. Digo meu nome, minha formação e quantos dentistas já formei. Só depois eu começo a escutar.", "cena": "[B-ROLL: TV da recepção com o nome de um paciente de exemplo, gravada na clínica, nome fictício]", "tela": "[CARTELA: Primeiro, a apresentação]"}, {"t": "27-38 s", "fala": "Aí o paciente fala, e eu não interrompo. Marco o que importa: sono, atividade física, bruxismo, há quanto tempo a queixa existe.", "cena": "[CENA: mãos marcando a ficha]", "tela": "[CARTELA: Escutar sem interromper]"}, {"t": "38-45 s", "fala": "Na Viver de DTM eu ensino essa condução. Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "cena": "[CENA: rosto]", "tela": "[CTA NA TELA: Conheça a formação Viver de DTM] [BOTÃO DA PLATAFORMA: Saiba mais]"}], "texto": "Dentista, consulta que começa com \"o que te traz aqui\" termina com \"eu vou pensar\". O Dr. Rodrigo Wendel começa de outro jeito.\n\nEle se apresenta, escuta sem interromper e conduz até o plano. Na Viver de DTM, ensina essa condução para dentista que não é especialista em DTM.\n\nConheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo_meta": "A consulta que não começa pela queixa", "desc": "Formação em DTM para dentistas", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=v2"}, {"n": 3, "titulo": "O exame físico que fecha o diagnóstico", "dur": "45 s", "cenas": [{"t": "0-3 s", "fala": "Palpo, escuto e meço antes de tratar.", "cena": "[CENA: Dr. Rodrigo Wendel ao lado da maca vazia, olhando para a câmera, com a mão no próprio rosto, sobre o músculo masseter]", "tela": "[CARTELA: Dentista, antes de tratar]"}, {"t": "3-15 s", "fala": "Esse é o exame físico de DTM, e ele é protocolar: palpação dos músculos, escuta dos sons da articulação, tipos de movimento e medida dos movimentos.", "cena": "[CENA: plano médio, ele mostra em si mesmo a palpação e a abertura da boca]", "tela": "[CARTELA: Palpar, escutar, medir]"}, {"t": "15-29 s", "fala": "Não é nada muito complexo, mas precisa ser aprendido: fazer o exame e interpretar o que a mão encontra. Sem isso, não existe diagnóstico, e sem diagnóstico não existe tratamento.", "cena": "[B-ROLL: consultorio-cadeira.jpg, push lento]", "tela": "[CARTELA: Sem exame, sem diagnóstico]"}, {"t": "29-38 s", "fala": "Na Viver de DTM teremos dias de imersão para você treinar esse exame com atendimento em pacientes reais.", "cena": "[B-ROLL: atendimento-ultrassom.jpg, crop sem rosto de paciente]", "tela": "[CARTELA: Treino com pacientes reais]"}, {"t": "38-45 s", "fala": "Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "cena": "[CENA: rosto]", "tela": "[CTA NA TELA: Conheça a formação Viver de DTM] [BOTÃO DA PLATAFORMA: Saiba mais]"}], "texto": "Dentista, palpação, escuta dos sons da articulação e medida dos movimentos: o exame físico de DTM é protocolar.\n\nNão é nada muito complexo, mas precisa ser aprendido. Na Viver de DTM, o Dr. Rodrigo Wendel ensina o exame e o treino é com pacientes reais, nas imersões.\n\nConheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo_meta": "O exame físico que fecha o diagnóstico", "desc": "Formação em DTM para dentistas", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=v3"}, {"n": 4, "titulo": "Eu era recém-formado", "dur": "45 s", "cenas": [{"t": "0-3 s", "fala": "Eu era recém-formado", "cena": "[CENA: Dr. Rodrigo Wendel em plano médio no consultório, olhando para a câmera]", "tela": "[CARTELA: Dentista, eu era recém-formado]"}, {"t": "3-14 s", "fala": "quando a especialidade de DTM foi criada e a prova de título pedia dez anos de experiência. Então sobrou a prova.", "cena": "[B-ROLL: ensinando-slide-dor.jpg, push lento]", "tela": "[CARTELA: Pediam dez anos]"}, {"t": "14-30 s", "fala": "Eram dez temas para estudar e eu não sabia qual dos dez ia cair, então estudei os dez. Escrevi uma dissertação sobre cada um. No dia, o tema sorteado já estava na minha cabeça.", "cena": "[CENA: plano fechado do rosto]", "tela": "[CARTELA: Estudei os dez temas]"}, {"t": "30-38 s", "fala": "Na Viver de DTM teremos dias de imersão com atendimento em pacientes reais.", "cena": "[B-ROLL: atendimento-ultrassom.jpg, crop sem rosto de paciente]", "tela": "[CARTELA: Imersão com pacientes reais]"}, {"t": "38-45 s", "fala": "Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "cena": "[CENA: rosto]", "tela": "[CTA NA TELA: Conheça a formação Viver de DTM] [BOTÃO DA PLATAFORMA: Saiba mais]"}], "texto": "Dentista, o Dr. Rodrigo Wendel era recém-formado quando a prova de título da DTM pedia dez anos de experiência.\n\nEram dez temas e ele não sabia qual ia cair, então estudou os dez. Na Viver de DTM, há dias de imersão com atendimento em pacientes reais.\n\nConheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo_meta": "Eu era recém-formado", "desc": "Dr. Rodrigo Wendel, UNIFESP", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=v4"}, {"n": 5, "titulo": "A ficha lida antes do paciente entrar", "dur": "30 s", "cenas": [{"t": "0-3 s", "fala": "Leio a ficha antes de o paciente entrar.", "cena": "[CENA: Dr. Rodrigo Wendel em pé na sala, ficha impressa na mão, lendo; ergue o olhar para a câmera]", "tela": "[CARTELA: Já li a ficha]"}, {"t": "3-13 s", "fala": "São quarenta perguntas: sono, atividade física, medicamentos. O paciente preenche antes de chegar.", "cena": "[B-ROLL: ficha de anamnese em close, sem dados de paciente]", "tela": "[CARTELA: 40 perguntas]"}, {"t": "13-24 s", "fala": "Quando ele senta, eu digo: já li a sua ficha. A consulta começa no ponto que importa, e ele já se sente acolhido.", "cena": "[CENA: Dr. Rodrigo Wendel sentado, de frente para a câmera, como se falasse ao paciente]", "tela": "[CARTELA: Ele se sente acolhido]"}, {"t": "24-30 s", "fala": "Essa ficha de anamnese faz parte das ferramentas da Viver de DTM. Conheça a formação Viver de DTM: peça sua conversa de 30 minutos.", "cena": "[CENA: rosto]", "tela": "[CTA NA TELA: Conheça a formação Viver de DTM] [BOTÃO DA PLATAFORMA: Saiba mais]"}], "texto": "Dentista, quarenta perguntas lidas antes de o paciente entrar: assim começa a consulta do Dr. Rodrigo Wendel.\n\nNa Viver de DTM, essa ficha de anamnese faz parte das ferramentas que você recebe. A formação é para dentista que não é especialista em DTM.\n\nA turma fundadora começa em 23 de fevereiro de 2027. Conheça a formação Viver de DTM: toque em Saiba mais e peça sua conversa de 30 minutos.", "titulo_meta": "A ficha lida antes de o paciente entrar", "desc": "Formação em DTM para dentistas", "url": "https://academiadtm.com.br/formacao?utm_source=meta&utm_medium=pago&utm_campaign=turma-fundadora&utm_content=v5"}], "carr": [{"n": "01", "titulo": "Mitos", "url": "https://canva.link/3rgya6c9l260usy", "legenda": "Seis coisas que eu ainda ouço de colega, 30 anos depois de começar a estudar DTM. E não escrevi isso pra constranger ninguém: a formação que eu tive também parava na compressa quente e na placa.\n\nQual desses você já acreditou? Me conta o número nos comentários. E segue a @academiadtm: é aqui que eu mostro como isso se resolve na cadeira.\n\n#DTM #DorOrofacial #Odontologia #CirurgiaoDentista #AcademiaDTM", "zip": "carr/carrossel-01.zip", "mb": 10.2, "thumbs": ["carr/01/01.jpg", "carr/01/02.jpg", "carr/01/03.jpg", "carr/01/04.jpg", "carr/01/05.jpg", "carr/01/06.jpg", "carr/01/07.jpg"]}, {"n": "03", "titulo": "O que o paciente vive antes do sim", "url": "https://canva.link/00014gdnvbqduil", "legenda": "Por muito tempo, muitos pacientes saíam da minha consulta dizendo \"vou pensar\". Vinham indicados, gostavam do atendimento e não fechavam.\n\nMudei a consulta inteira, do primeiro contato à despedida: uma pessoa só pra quem chega pela primeira vez, o nome do paciente na TV da minha sala, a minha apresentação antes de qualquer pergunta, a ficha lida antes, a explicação em três pontos, o tratamento desenhado numa folha da ficha e os sins antes do preço. Hoje o meu ticket médio é R$ 4.239.\n\nNa Viver de DTM, tudo isso é aula, da recepção ao fechamento. A turma fundadora começa em 23 de fevereiro de 2027 e leva os meus scripts de recepção nas apostilas e ferramentas práticas.\n\nAplica pelo link na bio e a gente marca.\n\n#DTM #DorOrofacial #DisfuncaoTemporomandibular #Odontologia #CirurgiaoDentista #ViverDeDTM #AcademiaDTM", "zip": "carr/carrossel-03.zip", "mb": 12.8, "thumbs": ["carr/03/01.jpg", "carr/03/02.jpg", "carr/03/03.jpg", "carr/03/04.jpg", "carr/03/05.jpg", "carr/03/06.jpg", "carr/03/07.jpg", "carr/03/08.jpg", "carr/03/09.jpg", "carr/03/10.jpg"]}, {"n": "05", "titulo": "Como funciona a formação", "url": "https://canva.link/drjy62exttyn7j8", "legenda": "Montei a Viver de DTM em cima do que eu ouvia de quem desistia da especialização de 2 anos: \"é muito longo\", \"é em Brasília todo mês\", \"eu queria online\". Por isso 35 terças da sua casa e 3 imersões em Brasília, com paciente real nas duas primeiras.\n\nSó a turma fundadora leva 2 dias na minha clínica acompanhando a minha rotina, além dos meus casos comentados, das apostilas e ferramentas práticas e do grupo no WhatsApp comigo dentro.\n\nTurma fundadora: começa em 23 de fevereiro de 2027.\n\nA porta é uma conversa, não um carrinho. Aplica pelo link na bio.\n\n#DTM #DorOrofacial #DisfuncaoTemporomandibular #Odontologia #CirurgiaoDentista #ViverDeDTM #AcademiaDTM", "zip": "carr/carrossel-05.zip", "mb": 10.5, "thumbs": ["carr/05/01.jpg", "carr/05/02.jpg", "carr/05/03.jpg", "carr/05/04.jpg", "carr/05/05.jpg", "carr/05/06.jpg", "carr/05/07.jpg", "carr/05/08.jpg"]}, {"n": "08", "titulo": "Quem é Rodrigo Wendel", "url": "https://canva.link/je8pn1j99xo47vl", "legenda": "Estudo DTM desde 1996, e tudo começou com um estalo na minha própria articulação, no primeiro ano de faculdade.\n\nFiz especialização e mestrado na UNIFESP quando DTM nem era especialidade, formei mais de 300 dentistas e atendi mais de 8 mil pacientes. E nunca larguei o consultório.\n\nPor 30 anos eu vi o paciente peregrinar e o dentista tratar DTM com a única ferramenta que tinha na mão. A Viver de DTM é a formação que eu montei pra quem não é especialista em DTM, seja clínico geral ou de qualquer outra especialidade, e hoje encaminha o paciente: 43 encontros, 35 deles da sua casa, e 8 dias comigo em Brasília.\n\nA turma fundadora começa em 23 de fevereiro de 2027. Aplica pelo link na bio e a gente marca.\n\n#DTM #Odontologia #CirurgiaoDentista #ViverDeDTM #AcademiaDTM", "zip": "carr/carrossel-08.zip", "mb": 14.2, "thumbs": ["carr/08/01.jpg", "carr/08/02.jpg", "carr/08/03.jpg", "carr/08/04.jpg", "carr/08/05.jpg", "carr/08/06.jpg", "carr/08/07.jpg", "carr/08/08.jpg", "carr/08/09.jpg", "carr/08/10.jpg"]}, {"n": "09", "titulo": "Você pode", "url": "https://www.canva.com/d/Jr8PFsf3zKvgj1d", "legenda": "Quase 30 anos atendendo DTM, e eu ainda encontro colega com medo desse paciente. Acha que vai terminar em cirurgia, que não dá pra ganhar dinheiro indicando o tratamento certo, que o caso não tem jeito.\n\nEnquanto isso, o paciente sai sem diagnóstico e vai pro próximo consultório. Passa pelo otorrino, pelo neurologista, pelo ortopedista, e cada um tenta uma coisa diferente.\n\nJuntei as quatro frases que eu mais gostaria de ter ouvido no começo:\n\n01 · Se o paciente só precisa da placa, eu ofereço só a placa. Meu ticket médio cai, e mais paciente fecha o tratamento.\n\n02 · Foram 17 anos de atendimento voluntário, quase 3 mil pacientes. A grande maioria melhorou sem cirurgia e sem mexer em dente.\n\n03 · Quem chega depois de rodar consultório vem duvidando de si mesmo. Eu quero ser o último dentista a tratar isso.\n\n04 · DTM é tipo dor de dente: cárie, pulpite e fratura doem igual, e cada uma pede um tratamento.\n\nNa minha faculdade, quase nenhum professor entendia de DTM. Aprendi na cadeira, com mais de 8 mil pacientes, e é isso que eu ensino na Viver de DTM, a minha formação pra clínico geral ou dentista de qualquer outra especialidade. A turma fundadora começa em 23 de fevereiro de 2027.\n\nQual delas te ensinaram ao contrário? Comenta o número.\n\n#DTM #DorOrofacial #DisfuncaoTemporomandibular #Odontologia #CirurgiaoDentista #ViverDeDTM #AcademiaDTM", "zip": "carr/carrossel-09.zip", "mb": 9.3, "thumbs": ["carr/09/01.jpg", "carr/09/02.jpg", "carr/09/03.jpg", "carr/09/04.jpg", "carr/09/05.jpg", "carr/09/06.jpg"]}], "emails": [{"id": "E1", "rotulo": "E1 · envio D-7", "titulo": "O paciente que estala já está na agenda", "sub": "", "assunto": "O paciente que estala já está na sua agenda", "preview": "Uma conta que a graduação não ensina a fazer", "corpo": "Colega,\n\nEu tinha um estalo na minha própria articulação quando entrei na faculdade. No primeiro ano, na aula de anatomia, olhei para a ATM e pensei que aquilo podia ser alguma coisa. Quase nenhum professor da faculdade entendia do assunto.\n\nAgora pense na sua última semana. Quantos pacientes mencionaram estalo ao mastigar, dor de cabeça constante ou desgaste nos dentes da frente? Se você anotou na ficha e seguiu para o dente, fez o que a graduação ensinou. Não é falta de talento: ela não ensina o critério para separar esses quadros.\n\nA conta é simples. **Cerca de 3 em cada 10 adultos** têm DTM (Valesan et al., 2021, Clinical Oral Investigations). Se a sua agenda tem adultos, esse paciente já está nela. Quando você encaminha, ele leva a avaliação, o plano e o retorno para outro consultório.\n\nDTM reúne cerca de dez diagnósticos sob um rótulo só, como um guarda-chuva, em três grupos: muscular, articular e deslocamento de disco. Cada grupo pede uma conduta diferente. Antes de intervir, você precisa entender qual deles está na frente.\n\nÉ esse raciocínio que ensino na Viver de DTM, formação para dentista que não é especialista em DTM, clínico geral ou de outra especialidade. A turma fundadora começa em 23 de fevereiro de 2027.\n\nVeja como a formação funciona:\nhttps://academiadtm.com.br/formacao?utm_source=email&utm_medium=lista&utm_campaign=turma-fundadora&utm_content=e1\n\nUm abraço,\nRodrigo Wendel\n\nPS: Em alguns dias escrevo sobre a ferramenta que quase todo clínico usa para qualquer caso de DTM, e sobre o que fazer quando ela não basta.", "envio": "D-7"}, {"id": "E2", "rotulo": "E2 · envio D-3", "titulo": "Quem só tem martelo vê prego em tudo", "sub": "", "assunto": "Quem só tem martelo vê prego em tudo", "preview": "O cirurgião quer operar. O clínico quer colocar placa.", "corpo": "Colega,\n\nO cirurgião quer operar, o ortodontista quer colocar aparelho, o protesista quer prótese, e o clínico que nunca aprendeu DTM quer colocar placa. Ninguém age de má-fé: cada especialidade empurra a ferramenta que domina, e pra quem só tem martelo, tudo é prego.\n\nEu chamo a alternativa de **cinto do Batman**: uma ferramenta para cada demanda e o critério para escolher entre elas. Exercício orientado, laser, liberação miofascial, infiltração e placa, quando há indicação. Quem determina o tratamento não sou eu. É a literatura, e a literatura recomenda tratamento multimodal.\n\nO critério também protege contra o erro oposto. Minha primeira formação era muito conservadora, e isso me fez perder a mão do momento de intervir em alguns casos. Não ajudei o paciente tanto quanto poderia. Hoje insisto no conservador por três a seis meses e avanço quando a resposta não vem, o diagnóstico está confirmado e a gravidade pede.\n\nEsse caminho, do conservador ao invasivo, com critério objetivo para avançar, é a Abordagem Multimodal. Ensino na Viver de DTM, para dentista que não é especialista em DTM.\n\nVeja como a formação funciona:\nhttps://academiadtm.com.br/formacao?utm_source=email&utm_medium=lista&utm_campaign=turma-fundadora&utm_content=e2\n\nUm abraço,\nRodrigo Wendel\n\nPS: Em poucos dias conto como funciona a turma fundadora e o que ela tem que as próximas não terão.", "envio": "D-3"}, {"id": "E3", "rotulo": "E3 · envio D0", "titulo": "A turma fundadora está aberta para aplicação", "sub": "", "assunto": "Abri a turma, e ela começa com uma conversa", "preview": "A conversa de 30 minutos vem antes da matrícula", "corpo": "Colega,\n\nPense no próximo paciente com dor na mandíbula. Ele senta na sua cadeira. Você abre a ficha, apalpa o masseter, mede a abertura, faz uma avaliação completa e diz o nome do quadro antes de ele levantar. Ele sai com um plano e com a próxima consulta marcada com você.\n\nFoi para formar esse dentista que montei a **Viver de DTM**. A turma fundadora está aberta para aplicação a partir de hoje.\n\nEla é para o dentista que **não é especialista em DTM**: clínico geral ou de qualquer outra especialidade, como ortodontia, prótese e cirurgia. Se o paciente de DTM já senta na sua cadeira e hoje você encaminha ou indica placa, a formação é para você.\n\nO que a turma tem:\n• 43 encontros em 2027, com aula online ao vivo toda semana e 3 imersões presenciais em Brasília (20 a 22 de maio, 21 a 23 de outubro, 29 e 30 de novembro)\n• 4 dias com a mão no paciente, nas duas primeiras imersões. A terceira é de gestão, comercial e planejamento da clínica\n• 2 dias na minha clínica, acompanhando a minha rotina. Esse bônus existe só na turma fundadora\n• Certificado credenciado pelo MEC\n\nA turma começa na terça, 23 de fevereiro de 2027, e termina em 30 de novembro.\n\nPara entrar, você aplica e conversa 30 minutos comigo, por vídeo. Eu ouço o seu caso, mostro a formação e, se fizer sentido para os dois lados, apresento a proposta. A conversa não te compromete com nada.\n\nAplique e marque a sua conversa de 30 minutos:\nhttps://academiadtm.com.br/formacao?utm_source=email&utm_medium=lista&utm_campaign=turma-fundadora&utm_content=e3\n\nUm abraço,\nRodrigo Wendel\n\nPS: O investimento e as condições de pagamento eu apresento na conversa, junto com a proposta completa. Aplique pelo link acima.", "envio": "D0"}, {"id": "E4", "rotulo": "E4 · envio D+3", "titulo": "Duas pacientes, o mesmo quadro", "sub": "", "assunto": "Duas pacientes, o mesmo quadro", "preview": "O que mudou entre uma e outra não foi o diagnóstico", "corpo": "Colega,\n\nRecebi duas pacientes com anos de diferença entre uma e outra. As duas tinham uma degeneração grande na articulação e envolvimento emocional. O diagnóstico era o mesmo.\n\nCom a primeira, usei os recursos que eu tinha na época. Ela ficou bem, mantém contato comigo até hoje, mas ficou com uma sequela na mordida.\n\nCom a segunda, anos depois, eu tinha mais recursos terapêuticos, de DTM e ortodônticos. Ela não ficou com a mesma sequela funcional e estética.\n\nAquilo me marcou. Acompanhar o que o tratamento ganhou de novo muda o resultado do paciente, e quem se formou há dez anos com uma ferramenta só não tem como saber o que mudou.\n\nÉ por isso que a Viver de DTM não acaba na teoria. Nas duas primeiras imersões são **4 dias com a mão no paciente**, com supervisão. Cada etapa termina numa imersão.\n\nQuem ensina tem a experiência para isso: **cerca de 30 anos estudando DTM**, **mais de 8.000 pacientes atendidos**, **mais de 300 dentistas formados** e especialização e mestrado pela UNIFESP.\n\nA formação é para dentista que não é especialista em DTM. A turma fundadora começa em 23 de fevereiro de 2027, e antes dela vem uma conversa de 30 minutos comigo, por vídeo.\n\nVeja as imersões e aplique:\nhttps://academiadtm.com.br/formacao?utm_source=email&utm_medium=lista&utm_campaign=turma-fundadora&utm_content=e4\n\nUm abraço,\nRodrigo Wendel\n\nPS: Na turma fundadora, você passa 2 dias na minha clínica vendo como eu atendo, da av /* carrosséis */
S.carrosseis=`<div class="topacao"><h2>Carrosséis</h2></div>
<div class="info">Para postar no feed do <b>@academiadtm</b>. Cada carrossel tem o zip com as imagens na ordem certa (1080×1350) e a legenda pronta para copiar.</div>`+
D.carr.map(c=>`<section class="card" id="c${c.n}"><div class="num">Carrossel ${esc(c.n)}</div><h3>${esc(c.titulo)}</h3>
 <div class="tira">${(c.thumbs||[]).map((s,i)=>`<img src="${s}" alt="Carrossel ${esc(c.n)}, imagem ${i+1}" loading="lazy">`).join('')}</div>
 <p class="acoes-c">${c.zip?`<a class="btn lima" href="${c.zip}" download>Baixar carrossel (.zip · ${c.thumbs.length} imagens · ${String(c.mb).replace('.',',')} MB)</a>`:''} <a class="btn cl" href="${esc(c.url)}" target="_blank" rel="noopener">Ver no Canva</a></p>
 ${c.legenda?campo('Legenda',c.legenda):'<div class="campo"><div class="lbl"><span>Legenda</span></div><pre class="vazio">Legenda em produção.</pre></div>'}</section>`).join('');
/* e-mails e whatsapp */
const msg=(x,isEmail)=>`<section class="card" id="${x.id.toLowerCase()}"><div class="num">${esc(x.rotulo)}</div><h3>${esc(x.titulo)}</h3>${x.sub?`<div class="sub">${esc(x.sub)}</div>`:''}
 ${isEmail?campo('Assunto',x.assunto)+campo('Preview',x.preview)+campo('Corpo do e-mail',x.corpo):campo('Mensagem',x.corpo)}</section>`;
S.emails=`<div class="topacao"><h2>E-mails</h2></div><div class="info">Sequência para a lista (DTM Para Todos e seguidores) e um e-mail para ex-alunos pedindo indicação. Assunto, preview e corpo copiam separados.</div>`+D.emails.map(x=>msg(x,true)).join('');
S.whatsapp=`<div class="topacao"><h2>Mensagens de WhatsApp</h2></div><div class="info">Para a lista no WhatsApp e uma para ex-alunos pedindo indicação. O que está entre asteriscos aparece em negrito no WhatsApp.</div>`+D.zaps.map(x=>msg(x,false)).join('');
document.getElementById('main').innerHTML=ABAS.map(([id])=>`<div class="aba" id="aba-${id}">${S[id]}</div>`).join('');
/* navegação por hash */
function mostra(){const h=(location.hash||'#visao').slice(1);const a=ABAS.some(x=>x[0]===h)?h:'visao';
  document.querySelectorAll('.aba').forEach(e=>e.classList.toggle('on',e.id==='aba-'+a));
  document.querySelectorAll('.abas a').forEach(e=>{const on=e.dataset.a===a;e.classList.toggle('on',on);if(on)e.scrollIntoView({block:'nearest',inline:'nearest'})});}
addEventListener('hashchange',()=>{mostra();scrollTo(0,0)});mostra();
/* copiar */
document.addEventListener('click',async e=>{const b=e.target.closest('.cp');if(!b)return;const t=COPIA[+b.dataset.c];
  try{await navigator.clipboard.writeText(t)}catch(_){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();document.execCommand('copy');x.remove()}
  const o=b.textContent;b.textContent='Copiado';b.classList.add('feito');setTimeout(()=>{b.textContent=o;b.classList.remove('feito')},1800)});
/* zip */
document.getElementById('zip').onclick=async e=>{const b=e.currentTarget;const t=b.textContent;b.disabled=true;
  try{const z=new JSZip();let k=0;for(const a of D.ads){for(const f of ['feed','story']){const id='ad'+pad(a.n);b.textContent='Preparando '+(++k)+'/'+D.ads.length*2+'…';
      const r=await fetch(`png/${id}-${f}.png`);if(!r.ok)throw 0;z.file(`academiadtm-${id}-${f}.png`,await r.blob())}}
    const blob=await z.generateAsync({type:'blob'});window.__zip={n:Object.keys(z.files).length,size:blob.size};
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='criativos-academiadtm.zip';document.body.appendChild(l);l.click();l.remove();b.textContent='Zip baixado'}
  catch(err){b.textContent='Não deu certo, baixe um por um abaixo'}
  setTimeout(()=>{b.textContent=t;b.disabled=false},4000)};
</script>
</body>
</html>

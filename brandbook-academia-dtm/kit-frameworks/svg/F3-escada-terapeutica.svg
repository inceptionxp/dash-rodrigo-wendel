  <text x="60" y="512" font-family="Hanken Grotesk, -apple-system, sans-serif" font-size="16" font-weight="400" fill="currentColor" letter-spacing="0" text-anchor="start" opacity="0.62">liberação miofascial · exercícios</text>
  <line x1="156" y1="392" x2="156" y2="408" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
  <rect x="130" y="272" width="360" height="120" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>

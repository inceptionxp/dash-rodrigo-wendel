  <line x1="246" y1="256" x2="246" y2="272" stroke="currentColor" stroke-width="1.5" opacity="0.45"/>
  <rect x="220" y="136" width="360" height="120" fill="currentColor" fill-opacity="0.16" stroke="currentColor" stroke-width="1.5"/>
  <line x1="220" y1="136" x2="580" y2="136" stroke="#CDF23F" stroke-width="6"/>
  <text x="240" y="166" font-family="Space Mono, ui-monospace, SFMono-Regular, monospace" font-size="17" font-weight="700" fill="currentColor" letter-spacing="1.6" text-anchor="start" opacity="0.55">03</text>
  <text x="240" y="196" font-family="Archivo, system-ui, sans-serif" font-size="22" font-weight="700" fill="currentColor" letter-spacing="-0.22" text-anchor="start">Invasivo</text>

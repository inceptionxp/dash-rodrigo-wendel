  <rect x="40" y="408" width="360" height="120" fill="currentColor" fill-opacity="0.07" stroke="currentColor" stroke-width="1.5"/>
  <text x="60" y="438" font-family="Space Mono, ui-monospace, SFMono-Regular, monospace" font-size="17" font-weight="700" fill="currentColor" letter-spacing="1.6" text-anchor="start" opacity="0.55">01</text>
